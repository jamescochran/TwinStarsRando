name: Tests

on:
  # Pushes to main run these tests through deploy.yml (workflow_call), which only
  # deploys if they pass, so main isn't listed here (it would run everything twice).
  push:
    branches: ["feature/**"]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-check:
    # Cheap guard: the deploy build's stamping (cache name + footer stamp) still matches
    # the current service-worker.js and index.html markup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check deploy stamping
        run: .github/scripts/check-build-site.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: cd tests && npm ci

      - name: Install Playwright browser
        run: cd tests && npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: cd tests && npx playwright test --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: tests/playwright-report/
          retention-days: 7
